name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry
        run: |
          version="${{ steps.version.outputs.version }}"
          awk "/^### ${version}\$/{p=1} p && /^### / && !/^### ${version}\$/{p=0} p" readme.md > release_notes.md

      - name: Build ZIP
        run: |
          version="${{ steps.version.outputs.version }}"
          plugin="polylang-tcopro"
          zip_name="${plugin}-${version}.zip"

          mkdir -p /tmp/build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='readme.txt' \
            . "/tmp/build/${plugin}/"

          cd /tmp/build
          zip -r "${GITHUB_WORKSPACE}/${zip_name}" "${plugin}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: polylang-tcopro-${{ steps.version.outputs.version }}.zip

  wporg-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: integrate-polylang-tcopro
